services:
  agent-service:
    build:
      context: .
      dockerfile: services/agent-service/Dockerfile
    container_name: agent-service
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - mcp-service
      - rag-service

  mcp-service:
    build:
      context: .
      dockerfile: services/mcp-service/Dockerfile
    container_name: mcp-service
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    container_name: rag-service
    ports:
      - "8083:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
